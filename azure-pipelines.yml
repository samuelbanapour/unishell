# Builds standalone UniShell binaries for Linux, Windows, and macOS
# (a true universal2 binary: arm64 + x86_64 combined via lipo), then on a
# version-tag push, attaches them all to a GitHub Release.
trigger:
  tags:
    include:
      - v*
  branches:
    include:
      - main
      - master

pr: none

variables:
  binaryName: 'unishell'

stages:
  - stage: Build
    jobs:
      - job: linux
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
          - script: |
              python -m pip install --upgrade pip
              pip install -e . pyinstaller
              pyinstaller --onefile --name $(binaryName) src/unishell/shell.py
            displayName: 'Build Linux binary'
          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: 'dist/$(binaryName)'
              artifact: 'unishell-linux-x86_64'

      - job: windows
        pool:
          vmImage: 'windows-latest'
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
          - script: |
              python -m pip install --upgrade pip
              pip install -e . pyinstaller
              pyinstaller --onefile --name $(binaryName) src/unishell/shell.py
            displayName: 'Build Windows binary'
          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: 'dist\$(binaryName).exe'
              artifact: 'unishell-windows-x86_64'

      - job: macos_universal
        pool:
          vmImage: 'macOS-latest'
        steps:
          - script: |
              set -e
              # Azure's Microsoft-hosted macOS pool only has an arm64 image
              # ("macOS-13"/Intel was retired), and UsePythonVersion@0's
              # cached interpreter doesn't match every -arch invocation
              # cleanly. So we install python.org's own universal2 build
              # (a real fat binary since 3.9.1) and drive it under `arch`
              # to get a genuine, natively-compiled binary for each slice,
              # then lipo them together.
              curl -fsSL -o python.pkg https://www.python.org/ftp/python/3.11.9/python-3.11.9-macos11.pkg
              sudo installer -pkg python.pkg -target /
              PY=/Library/Frameworks/Python.framework/Versions/3.11/bin/python3.11
              softwareupdate --install-rosetta --agree-to-license || true
              for ARCH in arm64 x86_64; do
                arch -$ARCH $PY -m venv "venv-$ARCH"
                arch -$ARCH "venv-$ARCH/bin/pip" install --upgrade pip -q
                arch -$ARCH "venv-$ARCH/bin/pip" install -e . pyinstaller -q
                arch -$ARCH "venv-$ARCH/bin/pyinstaller" --onefile --name $(binaryName) \
                  --distpath "dist-$ARCH" --workpath "build-$ARCH" --specpath "spec-$ARCH" \
                  --target-arch $ARCH src/unishell/shell.py
              done
              mkdir -p dist
              lipo -create "dist-arm64/$(binaryName)" "dist-x86_64/$(binaryName)" -output "dist/$(binaryName)"
              chmod +x "dist/$(binaryName)"
              lipo -info "dist/$(binaryName)"
            displayName: 'Build macOS universal2 binary (arm64 + x86_64 via lipo)'
          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: 'dist/$(binaryName)'
              artifact: 'unishell-macos-universal2'

  - stage: Release
    dependsOn: Build
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
    jobs:
      - job: github_release
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - download: current
            artifact: 'unishell-linux-x86_64'
          - download: current
            artifact: 'unishell-windows-x86_64'
          - download: current
            artifact: 'unishell-macos-universal2'
          - script: |
              mkdir -p release
              cp "$(Pipeline.Workspace)/unishell-linux-x86_64/$(binaryName)" "release/unishell-linux-x86_64"
              cp "$(Pipeline.Workspace)/unishell-windows-x86_64/$(binaryName).exe" "release/unishell-windows-x86_64.exe"
              cp "$(Pipeline.Workspace)/unishell-macos-universal2/$(binaryName)" "release/unishell-macos-universal2"
              chmod +x release/*
            displayName: 'Stage release assets'
          - task: GitHubRelease@1
            inputs:
              gitHubConnection: 'unishell-github'
              repositoryName: '$(Build.Repository.Name)'
              action: 'create'
              target: '$(Build.SourceVersion)'
              tag: '$(Build.SourceBranchName)'
              title: 'UniShell $(Build.SourceBranchName)'
              releaseNotesSource: 'inline'
              releaseNotesInline: 'Automated release built by Azure Pipelines for Linux, Windows, and macOS (universal2).'
              assets: 'release/*'
              isDraft: false
              isPreRelease: false
