# Builds standalone UniShell binaries for Linux, Windows, and macOS, then on
# a version-tag push, attaches them all to a GitHub Release.
#
# The macOS binary is x86_64: Azure Pipelines' Microsoft-hosted macOS pool
# is Intel-only (no Apple Silicon hosted agents), so a true universal2 fat
# binary isn't buildable there. The x86_64 binary still runs on Apple
# Silicon Macs transparently via Rosetta 2, which ships by default on all
# of them.
trigger:
  tags:
    include:
      - v*
  branches:
    include:
      - main
      - master

pr: none

variables:
  binaryName: 'unishell'

stages:
  - stage: Build
    jobs:
      - job: linux
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
          - script: |
              python -m pip install --upgrade pip
              pip install -e . pyinstaller
              pyinstaller --onefile --name $(binaryName) src/unishell/shell.py
            displayName: 'Build Linux binary'
          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: 'dist/$(binaryName)'
              artifact: 'unishell-linux-x86_64'

      - job: windows
        pool:
          vmImage: 'windows-latest'
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
          - script: |
              python -m pip install --upgrade pip
              pip install -e . pyinstaller
              pyinstaller --onefile --name $(binaryName) src/unishell/shell.py
            displayName: 'Build Windows binary'
          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: 'dist\$(binaryName).exe'
              artifact: 'unishell-windows-x86_64'

      - job: macos
        pool:
          vmImage: 'macOS-latest'
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
          - script: |
              python -m pip install --upgrade pip
              pip install -e . pyinstaller
              pyinstaller --onefile --name $(binaryName) src/unishell/shell.py
            displayName: 'Build macOS binary (x86_64, runs on Apple Silicon via Rosetta 2)'
          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: 'dist/$(binaryName)'
              artifact: 'unishell-macos-x86_64'

  - stage: Release
    dependsOn: Build
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
    jobs:
      - job: github_release
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - download: current
            artifact: 'unishell-linux-x86_64'
          - download: current
            artifact: 'unishell-windows-x86_64'
          - download: current
            artifact: 'unishell-macos-x86_64'
          - script: |
              mkdir -p release
              cp "$(Pipeline.Workspace)/unishell-linux-x86_64/$(binaryName)" "release/unishell-linux-x86_64"
              cp "$(Pipeline.Workspace)/unishell-windows-x86_64/$(binaryName).exe" "release/unishell-windows-x86_64.exe"
              cp "$(Pipeline.Workspace)/unishell-macos-x86_64/$(binaryName)" "release/unishell-macos-x86_64"
              chmod +x release/*
            displayName: 'Stage release assets'
          - task: GitHubRelease@1
            inputs:
              gitHubConnection: 'unishell-github'
              repositoryName: '$(Build.Repository.Name)'
              action: 'create'
              target: '$(Build.SourceVersion)'
              tag: '$(Build.SourceBranchName)'
              title: 'UniShell $(Build.SourceBranchName)'
              releaseNotesSource: 'inline'
              releaseNotesInline: 'Automated release built by Azure Pipelines for Linux, Windows, and macOS (x86_64; runs on Apple Silicon via Rosetta 2).'
              assets: 'release/*'
              isDraft: false
              isPreRelease: false
